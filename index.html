<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moose Knuckles | Product Verification</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 360px;
      padding: 30px 20px;
    }
    .loader {
      border: 3px solid #262626;
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hidden { display: none; }
    .badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #1db954;
      color: white;
      font-size: 32px;
      line-height: 64px;
      margin: 0 auto 20px auto;
      box-shadow: 0 0 20px rgba(29, 185, 84, 0.4);
    }
    h1 {
      font-size: 19px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    p.sub {
      color: #999;
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 25px;
    }
    .details {
      background: #171717;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
      font-size: 13px;
      line-height: 1.9;
    }
    .details div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #222;
      padding: 4px 0;
    }
    .details div:last-child {
      border-bottom: none;
    }
    .label { color: #777; }
    .val { font-weight: 600; color: #eee; font-family: monospace; font-size: 13.5px; }
    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      border-radius: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Step 1: Simulated Cryptographic Check -->
  <div id="loading" class="container">
    <div class="loader"></div>
    <h1>Verifying NFC Tag</h1>
    <p class="sub">Validating cryptographic signature...</p>
  </div>

  <!-- Step 2: Authentic Confirmation Screen -->
  <div id="verified" class="container hidden">
    <div class="badge">✓</div>
    <h1>Authentic Product</h1>
    <p class="sub">This item has been verified via NFC.</p>
    
    <div class="details">
      <div><span class="label">Brand</span><span class="val">Moose Knuckles</span></div>
      <div><span class="label">Style</span><span class="val">Original Ballistic Bomber</span></div>
      <div><span class="label">Edition</span><span class="val">Fusion</span></div>
      <div><span class="label">SKU</span><span class="val">M35MB000S-305</span></div>
      <div><span class="label">Size</span><span class="val">L</span></div>
      <div><span class="label">Authenticity Code</span><span class="val">6000450110540</span></div>
    </div>

    <a href="https://www.mooseknucklescanada.com/products/original-ballistic-down-bomber-m35mb000s-305?variant=46626676801771" class="btn">View Official Product</a>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('verified').classList.remove('hidden');
    }, 1800);
  </script>
</body>
</html>
